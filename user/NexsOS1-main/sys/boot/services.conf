# name|mode|executable|arguments|compatibility registry key|optional authority
# The selected image owns this startup declaration. nxmanageDD supervises the
# resulting processes but does not resolve a second executable catalog.
# lock = supervise; once = wait for real completion; start = launch once
# debug = MDEBUG-only asynchronous start
notify|lock|/sys/services/nxntfy_srv||srv.notify_pid
exec|lock|/sys/services/nxexecd||
timer|lock|/sys/services/nxtimerdd||
pax|lock|/sys/services/nxpaxd||
environment|once|/sys/bin/nxenvinit||
compositor|lock|/sys/services/nxcompositor||srv.compositor_pid
keyboard|lock|/sys/services/nxkeyboardd||
pointer|lock|/sys/services/nxmoused||srv.mouse_pid|window-manage
desktop|lock|/sys/bin/nxui||srv.dock_pid
bar|lock|/sys/bin/nxbar||srv.bar_pid
launcher|lock|/sys/bin/nxlauncher||srv.launcher_pid
shell|start|/sys/services/nxttyd|--shell /sys/bin/nxshell|
tests|async|/sys/services/nxttyd|/sys/bin/nxtestrunner|
roleprobe|debug|/sys/bin/nxroleprobe||
