# name|mode|system image|arguments|compatibility registry key|optional authority
# nxmanageDD receives only registered image identities; storage paths live in
# images.conf and are imported into protected system.boot.image.* objects.
# lock = supervise; once = wait real completion; start = launch without respawn
# debug = mdebug-only async once
notify|lock|notify||srv.notify_pid
exec|lock|exec||
timer|lock|timer||
pax|lock|pax||
environment|once|environment||
compositor|lock|compositor||srv.compositor_pid
keyboard|lock|keyboard||
pointer|lock|pointer||srv.mouse_pid|window-manage
desktop|lock|desktop||srv.dock_pid
bar|lock|bar||srv.bar_pid
launcher|lock|launcher||srv.launcher_pid
# Interactive shell starts inside its own userland TTY session.
shell|start|shell|/sys/bin/nxshell|
tests|debug|tests|-c /sys/bin/nxtestrunner|
roleprobe|debug|roleprobe||
