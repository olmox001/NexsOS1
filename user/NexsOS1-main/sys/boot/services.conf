# name|mode|executable|arguments|compatibility registry key|required caps:... authority
# The selected image owns this startup declaration. nxmanageDD supervises the
# resulting processes but does not resolve a second executable catalog.
# lock = supervise; once = wait for real completion; start = launch once
# debug = MDEBUG-only asynchronous start
notify|lock|/sys/services/nxntfy_srv||srv.notify_pid|caps:ipc-any,registry-write,window
exec|lock|/sys/services/nxexecd|||caps:spawn,ipc-any,registry-write
timer|lock|/sys/services/nxtimerdd|||caps:ipc-any,registry-write
pax|lock|/sys/services/nxpaxd|||caps:ipc-any,registry-write
environment|once|/sys/bin/nxenvinit|||caps:fs-write,registry-write
compositor|lock|/sys/services/nxcompositor||srv.compositor_pid|caps:ipc-any,window,window-manage,registry-write
keyboard|lock|/sys/services/nxkeyboardd|||caps:ipc-any,registry-write,keyboard-raw
pointer|lock|/sys/services/nxmoused||srv.mouse_pid|caps:ipc-any,window,window-manage,registry-write,pointer-raw
desktop|lock|/sys/bin/nxui||srv.dock_pid|caps:spawn,ipc-any,window,window-manage,registry-write
bar|lock|/sys/bin/nxbar||srv.bar_pid|caps:spawn,ipc-any,window,registry-write
launcher|lock|/sys/bin/nxlauncher||srv.launcher_pid|caps:spawn,fs-write,ipc-any,window,registry-write
terminal|start|/sys/services/nxttyd|/sys/bin/nxshell||caps:spawn,fs-write,ipc-any,window,registry-write
tests|async|/sys/services/nxttyd|/sys/bin/nxtestrunner||caps:spawn,fs-write,ipc-any,window,registry-write
roleprobe|debug|/sys/bin/nxroleprobe|||caps:spawn,fs-write,ipc-any,window,registry-write
