# name|mode|executable|arguments|compatibility registry key
# The manager knows NONE of these service names; names are registered first
# through authenticated PORT metadata and published as registry objects.
# lock = supervise; once = wait real completion; start = launch without respawn
# debug = mdebug-only async once
notify|lock|/sys/services/nxntfy_srv||srv.notify_pid
exec|lock|/sys/services/nxexecd||
timer|lock|/sys/services/nxtimerdd||
pax|lock|/sys/services/nxpaxd||
environment|once|/sys/bin/nxenvinit||
compositor|lock|/sys/services/nxcompositor||srv.compositor_pid
keyboard|lock|/sys/services/nxkeyboardd||
pointer|lock|/sys/services/nxmoused||srv.mouse_pid
desktop|lock|/sys/bin/nxui||srv.dock_pid
bar|lock|/sys/bin/nxbar||srv.bar_pid
launcher|lock|/sys/bin/nxlauncher||srv.launcher_pid
shell|start|/sys/bin/nxshell||
tests|debug|/sys/bin/nxshell|-c /sys/bin/nxtestrunner|
roleprobe|debug|/sys/bin/nxroleprobe||
