# mode|absolute executable|arguments (space-separated)|registry publication key
# lock = supervise; once = wait successful completion; debug = mdebug-only asynchronous once
# Order is authoritative: init registers each line and waits for manager ACK.
lock|/sys/bin/nxntfy_srv||srv.notify_pid
lock|/sys/bin/nxexec|--service|
lock|/sys/services/nxtimerdd||
lock|/sys/bin/nxpax|--service|
once|/sys/bin/nxenvinit||
lock|/sys/bin/nxcompositor||srv.compositor_pid
lock|/sys/bin/nxkeyboardd||
lock|/sys/bin/nxmoused||srv.mouse_pid
lock|/sys/bin/nxui||srv.dock_pid
lock|/sys/bin/nxbar||srv.bar_pid
lock|/sys/bin/nxlauncher||srv.launcher_pid
lock|/sys/bin/nxshell||
debug|/sys/bin/nxshell|-c /sys/bin/nxtestrunner|
